<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030a03"/>
      <stop offset="100%" stop-color="#0a1f0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Shield logo -->
  <g transform="translate(80,80)">
    <path d="M40 0 C40 0 4 9 4 36 C4 56 16 73 40 90 C64 73 76 56 76 36 C76 9 40 0 40 0Z" fill="url(#shieldGrad)"/>
    <path d="M40 24 C40 24 32 32 32 44 C32 51 36 56 40 60 C44 56 48 51 48 44 C48 32 40 24 40 24Z" fill="#f0fdf4" opacity="0.92"/>
  </g>

  <!-- Wordmark -->
  <text x="180" y="135" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="800" fill="#ffffff">Clean<tspan font-style="italic" font-weight="500" fill="#4ade80">Wear</tspan></text>
  <text x="180" y="172" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" letter-spacing="3" fill="#6b8f6b" font-weight="600">CHEMICAL SAFETY SCANNER</text>

  <!-- Headline -->
  <text x="80" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="800" fill="#ffffff">Know what's really</text>
  <text x="80" y="400" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="800" fill="#ffffff">in your <tspan fill="#4ade80" font-style="italic">clothes.</tspan></text>

  <!-- Subhead -->
  <text x="80" y="465" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" fill="#9ca3af">Scan any garment. See the hidden chemicals.</text>
  <text x="80" y="498" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" fill="#9ca3af">Built on peer-reviewed research.</text>

  <!-- CTA pill -->
  <g transform="translate(80,540)">
    <rect x="0" y="0" width="260" height="52" rx="26" fill="#16a34a"/>
    <text x="130" y="33" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">cleanwear.org</text>
  </g>

  <!-- Score badge mock -->
  <g transform="translate(900,260)">
    <circle cx="120" cy="120" r="120" fill="none" stroke="#1a2a1a" stroke-width="14"/>
    <circle cx="120" cy="120" r="120" fill="none" stroke="#4ade80" stroke-width="14" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="226" transform="rotate(-90 120 120)"/>
    <text x="120" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="84" font-weight="800" fill="#4ade80">88</text>
    <text x="120" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#6b8f6b" font-weight="600">/ 100</text>
  </g>
</svg>
